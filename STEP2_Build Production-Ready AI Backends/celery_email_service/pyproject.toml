[project]
name = "celery-email-service"
version = "0.1.0"
description = "A simple email service using celery for learning purposes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.2",
    "fastapi>=0.128.0",
    "redis>=7.1.0",
    "pydantic[email]>=2.0.0",
    "requests>=2.32.0",
    "uvicorn>=0.40.0",
    "python-dotenv>=1.0.0",
]
